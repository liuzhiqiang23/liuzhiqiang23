<svg xmlns="http://www.w3.org/2000/svg" width="480" height="76" viewBox="0 0 480 76">
  <style>
    .eq rect { transform-origin: center bottom; animation: eq 0.9s ease-in-out infinite; }
    .eq rect:nth-of-type(1) { animation-delay: 0s;   fill: #8B5CF6; }
    .eq rect:nth-of-type(2) { animation-delay: 0.18s; fill: #2DD4BF; }
    .eq rect:nth-of-type(3) { animation-delay: 0.36s; fill: #F0C46B; }
    .eq rect:nth-of-type(4) { animation-delay: 0.12s; fill: #E05252; }
    .eq rect:nth-of-type(5) { animation-delay: 0.30s; fill: #8B5CF6; }
    .eq rect:nth-of-type(6) { animation-delay: 0.06s; fill: #2DD4BF; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.30); }
      35%      { transform: scaleY(1.00); }
      65%      { transform: scaleY(0.55); }
    }
    .dot { animation: slide 26s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(300px); } }
  </style>

  <rect x="0.5" y="0.5" width="479" height="75" rx="16" fill="#0D141B" stroke="#223140"/>

  <!-- 播放键 -->
  <circle cx="38" cy="38" r="17" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <polygon points="33,29 33,47 49,38" fill="#2DD4BF"/>

  <!-- 均衡器动画 -->
  <g class="eq" transform="translate(66,26)">
    <rect x="0"  y="12" width="4" height="14" rx="2"/>
    <rect x="7"  y="12" width="4" height="14" rx="2"/>
    <rect x="14" y="12" width="4" height="14" rx="2"/>
    <rect x="21" y="12" width="4" height="14" rx="2"/>
    <rect x="28" y="12" width="4" height="14" rx="2"/>
    <rect x="35" y="12" width="4" height="14" rx="2"/>
  </g>

  <text x="116" y="33" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#F2F6F9">BGM · 国民党党歌（DJ 版）</text>
  <text x="116" y="54" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#7A8B9A">三枪打死麻辣烫 · 阿厦短剧原声 —— 点我去抖音听 ▶</text>

  <!-- 进度条 -->
  <line x1="36" y1="66" x2="444" y2="66" stroke="#223140" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="66" x2="126" y2="66" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <circle class="dot" cx="126" cy="66" r="4" fill="#F0C46B"/>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
</svg>
