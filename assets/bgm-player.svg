<svg xmlns="http://www.w3.org/2000/svg" width="520" height="84" viewBox="0 0 520 84">
  <style>
    .eq rect { transform-origin: center bottom; animation: eq 0.9s ease-in-out infinite; }
    .eq rect:nth-of-type(1) { animation-delay: 0s;   fill: #8B5CF6; }
    .eq rect:nth-of-type(2) { animation-delay: 0.18s; fill: #2DD4BF; }
    .eq rect:nth-of-type(3) { animation-delay: 0.36s; fill: #F0C46B; }
    .eq rect:nth-of-type(4) { animation-delay: 0.12s; fill: #E05252; }
    .eq rect:nth-of-type(5) { animation-delay: 0.30s; fill: #8B5CF6; }
    .eq rect:nth-of-type(6) { animation-delay: 0.06s; fill: #2DD4BF; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.30); }
      35%      { transform: scaleY(1.00); }
      65%      { transform: scaleY(0.55); }
    }
    .dot { animation: slide 26s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(330px); } }
    .ring { transform-origin: 44px 42px; animation: pulse 1.6s ease-out infinite; }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.55; }
      70%  { transform: scale(1.55); opacity: 0; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .note { animation: float 2.8s ease-in infinite; opacity: 0; }
    .note.n1 { animation-delay: 0s; }
    .note.n2 { animation-delay: 1.4s; }
    @keyframes float {
      0%   { transform: translate(0, 0);        opacity: 0; }
      25%  { opacity: 0.9; }
      100% { transform: translate(14px, -22px); opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#2DD4BF;#F0C46B;#E05252;#8B5CF6" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2DD4BF">
        <animate attributeName="stop-color" values="#2DD4BF;#F0C46B;#E05252;#8B5CF6;#2DD4BF" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="playg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="517" height="81" rx="18" fill="#0D141B" stroke="url(#border)" stroke-width="2.5"/>

  <!-- 播放键 + 脉冲光环 -->
  <circle class="ring" cx="44" cy="42" r="18" fill="none" stroke="#2DD4BF" stroke-width="2"/>
  <circle cx="44" cy="42" r="18" fill="none" stroke="url(#playg)" stroke-width="3"/>
  <polygon points="38,32 38,52 56,42" fill="#2DD4BF"/>

  <!-- 均衡器 -->
  <g class="eq" transform="translate(74,30)">
    <rect x="0"  y="16" width="4.5" height="16" rx="2"/>
    <rect x="8"  y="16" width="4.5" height="16" rx="2"/>
    <rect x="16" y="16" width="4.5" height="16" rx="2"/>
    <rect x="24" y="16" width="4.5" height="16" rx="2"/>
    <rect x="32" y="16" width="4.5" height="16" rx="2"/>
    <rect x="40" y="16" width="4.5" height="16" rx="2"/>
  </g>

  <text x="130" y="38" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">BGM · 三枪打死麻辣烫</text>
  <text x="130" y="61" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9FB3C8">阿厦短剧原声 · DJ 版 —— 点我去抖音听 ▶</text>

  <!-- 飘动音符 -->
  <text class="note n1" x="478" y="34" font-size="16" fill="#F0C46B">♪</text>
  <text class="note n2" x="492" y="40" font-size="13" fill="#2DD4BF">♫</text>

  <!-- 进度条 -->
  <line x1="44" y1="74" x2="476" y2="74" stroke="#223140" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="74" x2="140" y2="74" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <circle class="dot" cx="140" cy="74" r="4.5" fill="#F0C46B"/>
</svg>
